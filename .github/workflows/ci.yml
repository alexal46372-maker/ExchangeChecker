# CHK-CI-01 — Go 1.20.14, Windows amd64, CGO off. No build artifacts are uploaded.
# CHK-SQL-01 — windows job: no os/exec in the windows/amd64 dependency graph.
# CHK-SQL-01..05, CHK-MON-09 — linux job: SQL Server integration tests against a
# throwaway mssql container (EC_SQL_TEST_*); without these env vars the tests skip.
# CHK-MON-05/06/07 — windows job: Event Log, named pipe and SCM tests (*_windows_test.go).
# CHK-CI-01 (phase 4b) — linux job: go test -race for internal/monitor, internal/ipc,
# internal/sqlcheck. The race detector needs cgo, so CGO_ENABLED=1 is set for that one
# test step only; the windows release build and every other step stay CGO_ENABLED=0.
# CHK-TRAY-10 (phase 6a) — windows job: the tray (cmd/exchtray) links no SQL driver,
# no internal/sqlcheck, no os/exec; the tray is built as a GUI exe (not uploaded).
# CHK-IPC-01, CHK-TRAY-01..06 — linux job: -race for internal/trayipc, internal/trayui,
# internal/trayalert, internal/traysettings.
# CHK-RES-01, CHK-VER-01, CHK-SETUP-11 (phase 7a/7b) — both jobs: the committed .syso of
# cmd/exchsetup and cmd/exchsvc match tools/mkres; a release-like build (service, tray,
# uninstaller without payload, setup with -tags payload embedding them, -X version
# 0.0.0-ci.<run_number>, .syso regenerated with that version in the job's working copy
# only) is inspected by checks/ (EC_BUILD_DIR); go vet -tags payload; the exe files stay
# in $RUNNER_TEMP and are not uploaded (CHK-CI-01). windows job: setup dependency graph
# (no os/exec, SQL driver, x/sys); gated E2E CHK-SVC-01 / CHK-SETUP-12 after go test.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  windows:
    name: windows / go1.20.14 (CHK-CI-01)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          check-latest: false
          cache: false
      - name: go version (must be go1.20.14)
        run: |
          go version
          go env GOVERSION GOOS GOARCH CGO_ENABLED
          go version | grep -q "go1.20.14 windows/amd64"
      - name: go vet
        run: go vet ./...
      - name: no os/exec in the dependency graph (CHK-SQL-01)
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          deps="$(go list -deps ./cmd/... ./internal/...)"
          if printf '%s\n' "$deps" | grep -x "os/exec"; then
            echo "os/exec is linked into the windows/amd64 build"
            exit 1
          fi
          echo "packages in graph: $(printf '%s\n' "$deps" | grep -c .)"
      - name: tray dependencies (CHK-TRAY-10)
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          deps="$(go list -deps ./cmd/exchtray)"
          if printf '%s\n' "$deps" | grep -E -x "os/exec|database/sql|github.com/microsoft/go-mssqldb.*|golang.org/x/sys.*|.*/internal/sqlcheck"; then
            echo "forbidden package linked into the tray"
            exit 1
          fi
          echo "tray packages in graph: $(printf '%s\n' "$deps" | grep -c .)"
      - name: setup dependencies (CHK-SETUP-11)
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          deps="$(go list -deps ./cmd/exchsetup)"
          if printf '%s\n' "$deps" | grep -E -x "os/exec|database/sql|github.com/microsoft/go-mssqldb.*|golang.org/x/sys.*|.*/internal/(sqlcheck|monitor|ipc)|.*/tools/.*"; then
            echo "forbidden package linked into the setup"
            exit 1
          fi
          echo "setup packages in graph: $(printf '%s\n' "$deps" | grep -c .)"
      - name: go test (incl. named pipe / Event Log / SCM, CHK-MON-05..07)
        run: go test ./... -count=1 -v
      - name: go build (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build ./...
          go build -ldflags="-H windowsgui" -o "$RUNNER_TEMP/exchtray.exe" ./cmd/exchtray
      - name: release-like build with payload (CHK-RES-01, CHK-VER-01, CHK-SETUP-02; not uploaded)
        run: |
          go run ./tools/mkres -check
          V="0.0.0-ci.$GITHUB_RUN_NUMBER"
          out="$RUNNER_TEMP/release"
          pay="cmd/exchsetup/payload"
          mkdir -p "$out" "$pay"
          go run ./tools/mkres -version "$V"
          X="-X github.com/alexal46372-maker/ExchangeChecker/internal/version.Version=$V"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$X" -o "$pay/ExchangeCheckerSvc.exe" ./cmd/exchsvc
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H windowsgui $X" -o "$pay/ExchangeCheckerTray.exe" ./cmd/exchtray
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H windowsgui $X" -o "$pay/ExchangeCheckerUninstall.exe" ./cmd/exchsetup
          GOOS=windows GOARCH=amd64 go vet -tags payload ./cmd/exchsetup
          GOOS=windows GOARCH=amd64 go build -tags payload -trimpath -ldflags="-H windowsgui $X" -o "$out/ExchangeCheckerSetup.exe" ./cmd/exchsetup
          cp "$pay/ExchangeCheckerSvc.exe" "$out/"
          cp "$pay/ExchangeCheckerTray.exe" "$out/"
          cp "$pay/ExchangeCheckerUninstall.exe" "$out/"
          ls -la "$out"
          EC_BUILD_DIR="$out" EC_BUILD_VERSION="$V" go test ./checks -run 'CHK_RES_01_Built|CHK_VER_01_Built' -count=1 -v
          go run ./tools/mkres
          go run ./tools/mkres -check

      - name: service SCM E2E (CHK-SVC-01)
        env:
          EC_SVC_E2E: "1"
        run: |
          export EC_SVC_EXE="$RUNNER_TEMP/release/ExchangeCheckerSvc.exe"
          go test ./checks -run TestCHK_SVC_01_RealSCM -count=1 -v
      - name: setup silent E2E (CHK-SETUP-12 + upgrade + CHK-SETUP-03/04/05 windows)
        env:
          EC_SETUP_E2E: "1"
        run: |
          build_setup() {
            local ver="$1" out="$2"
            local X="-X github.com/alexal46372-maker/ExchangeChecker/internal/version.Version=$ver"
            local pay="$out/payload"
            mkdir -p "$pay"
            # svc matches release-like build (console, no -H windowsgui)
            GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$X" -o "$pay/ExchangeCheckerSvc.exe" ./cmd/exchsvc
            GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H windowsgui $X" -o "$pay/ExchangeCheckerTray.exe" ./cmd/exchtray
            GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H windowsgui $X" -o "$pay/ExchangeCheckerUninstall.exe" ./cmd/exchsetup
            rm -rf cmd/exchsetup/payload
            mkdir -p cmd/exchsetup/payload
            cp "$pay"/* cmd/exchsetup/payload/
            GOOS=windows GOARCH=amd64 go build -tags payload -trimpath -ldflags="-H windowsgui $X" -o "$out/ExchangeCheckerSetup.exe" ./cmd/exchsetup
          }
          build_setup "1.0.0" "$RUNNER_TEMP/e2e-v1"
          build_setup "1.1.0" "$RUNNER_TEMP/e2e-v2"
          export EC_SETUP_EXE="$RUNNER_TEMP/e2e-v1/ExchangeCheckerSetup.exe"
          export EC_SETUP_EXE_V2="$RUNNER_TEMP/e2e-v2/ExchangeCheckerSetup.exe"
          go test ./internal/wininstall -run 'TestCHK_SETUP_03_RealSCM|TestCHK_SETUP_04_EventSourceWindows|TestCHK_SETUP_05_ACLWindows' -count=1 -v
          go test ./checks -run TestCHK_SETUP_12_E2E -count=1 -v

  linux:
    name: linux / go1.20.14 vet + pure-Go tests + SQL Server integration
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "Ec_Test-Passw0rd!"
        ports:
          - 1433:1433
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          check-latest: false
          cache: false
      - name: go version (must be go1.20.14)
        run: |
          go version
          go version | grep -q "go1.20.14 linux/amd64"
      - name: go vet (linux + GOOS=windows)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: wait for SQL Server port
        run: |
          for i in $(seq 1 90); do
            if (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null; then echo "port 1433 open"; exit 0; fi
            sleep 2
          done
          echo "SQL Server did not open port 1433"
          exit 1
      - name: go test (with SQL Server integration, CHK-SQL-01..05, CHK-MON-09)
        env:
          EC_SQL_TEST_HOST: 127.0.0.1
          EC_SQL_TEST_PORT: "1433"
          EC_SQL_TEST_USER: sa
          EC_SQL_TEST_PASSWORD: "Ec_Test-Passw0rd!"
        run: go test ./... -count=1 -v
      - name: go test -race (monitor, ipc, sqlcheck, trayipc, trayui, trayalert, traysettings; cgo for this step only, CHK-CI-01)
        env:
          CGO_ENABLED: "1"
          EC_SQL_TEST_HOST: 127.0.0.1
          EC_SQL_TEST_PORT: "1433"
          EC_SQL_TEST_USER: sa
          EC_SQL_TEST_PASSWORD: "Ec_Test-Passw0rd!"
        run: go test -race -count=1 ./internal/monitor/... ./internal/ipc/... ./internal/sqlcheck/... ./internal/trayipc/... ./internal/trayui/... ./internal/trayalert/... ./internal/traysettings/...
      - name: release-like build with payload (CHK-RES-01, CHK-VER-01, CHK-SETUP-02; not uploaded)
        run: |
          go run ./tools/mkres -check
          V="0.0.0-ci.$GITHUB_RUN_NUMBER"
          out="$RUNNER_TEMP/release"
          pay="cmd/exchsetup/payload"
          mkdir -p "$out" "$pay"
          go run ./tools/mkres -version "$V"
          X="-X github.com/alexal46372-maker/ExchangeChecker/internal/version.Version=$V"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$X" -o "$pay/ExchangeCheckerSvc.exe" ./cmd/exchsvc
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H windowsgui $X" -o "$pay/ExchangeCheckerTray.exe" ./cmd/exchtray
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H windowsgui $X" -o "$pay/ExchangeCheckerUninstall.exe" ./cmd/exchsetup
          GOOS=windows GOARCH=amd64 go vet -tags payload ./cmd/exchsetup
          GOOS=windows GOARCH=amd64 go build -tags payload -trimpath -ldflags="-H windowsgui $X" -o "$out/ExchangeCheckerSetup.exe" ./cmd/exchsetup
          cp "$pay/ExchangeCheckerSvc.exe" "$out/"
          cp "$pay/ExchangeCheckerTray.exe" "$out/"
          cp "$pay/ExchangeCheckerUninstall.exe" "$out/"
          ls -la "$out"
          EC_BUILD_DIR="$out" EC_BUILD_VERSION="$V" go test ./checks -run 'CHK_RES_01_Built|CHK_VER_01_Built' -count=1 -v
          go run ./tools/mkres
          go run ./tools/mkres -check
