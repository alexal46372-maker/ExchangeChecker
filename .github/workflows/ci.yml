# CHK-CI-01 — Go 1.20.14, Windows amd64, CGO off. No build artifacts are uploaded.
# A plain-text test report is committed to the orphan branch `ci-reports`
# (reports/<sha>/<job>.txt) so results are readable with a contents-only token.
name: ci

on:
  push:
    branches-ignore:
      - ci-reports
  pull_request:

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  windows:
    name: windows / go1.20.14 (CHK-CI-01)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          check-latest: false
          cache: false
      - name: go version (must be go1.20.14)
        id: ver
        run: |
          mkdir -p ../ci-report
          go version | tee ../ci-report/version.txt
          go env GOVERSION GOOS GOARCH CGO_ENABLED | tee -a ../ci-report/version.txt
          grep -q "go1.20.14 windows/amd64" ../ci-report/version.txt
      - name: go vet
        id: vet
        run: go vet ./... 2>&1 | tee ../ci-report/vet.txt
      - name: go test
        id: test
        run: go test ./... -count=1 -v 2>&1 | tee ../ci-report/test.txt
      - name: go build (windows/amd64)
        id: build
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./... 2>&1 | tee ../ci-report/build.txt
      - name: publish text report to ci-reports branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: windows
          OUTCOMES: "version=${{ steps.ver.outcome }} vet=${{ steps.vet.outcome }} test=${{ steps.test.outcome }} build=${{ steps.build.outcome }} job=${{ job.status }}"
        run: bash .github/workflows/publish-report.sh

  linux:
    name: linux / go1.20.14 vet + pure-Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          check-latest: false
          cache: false
      - name: go version (must be go1.20.14)
        id: ver
        run: |
          mkdir -p ../ci-report
          go version | tee ../ci-report/version.txt
          grep -q "go1.20.14 linux/amd64" ../ci-report/version.txt
      - name: go vet (linux + GOOS=windows)
        id: vet
        run: |
          go vet ./... 2>&1 | tee ../ci-report/vet.txt
          GOOS=windows GOARCH=amd64 go vet ./... 2>&1 | tee -a ../ci-report/vet.txt
      - name: go test
        id: test
        run: go test ./... -count=1 -v 2>&1 | tee ../ci-report/test.txt
      - name: publish text report to ci-reports branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: linux
          OUTCOMES: "version=${{ steps.ver.outcome }} vet=${{ steps.vet.outcome }} test=${{ steps.test.outcome }} job=${{ job.status }}"
        run: bash .github/workflows/publish-report.sh
